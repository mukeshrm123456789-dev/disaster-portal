apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-portal-deployment
  labels:
    app: disaster-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: disaster-portal
  template:
    metadata:
      labels:
        app: disaster-portal
    spec:
      containers:
      - name: disaster-portal
        image: <muki1376>/disaster-portal:v1.0
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-portal-service
spec:
  type: NodePort
  selector:
    app: disaster-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080